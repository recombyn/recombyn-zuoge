# Private -> public publish (runs only in recombyn-dev).
# Strips commercial paths before publishing to github.com/recombyn/zuoge.
#
# Secret (recombyn-dev): PUBLIC_REPO_TOKEN - PAT with repo scope on recombyn/zuoge
# Public commits use concrete change subjects (not "Merge pull request #N") + [skip ci].

name: Publish OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-oss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, Windows, ci]
    defaults:
      run:
        shell: bash
    env:
      PUBLIC_REPO: recombyn/zuoge
    steps:
      - name: Checkout private tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "recombyn"
          git config --global user.email "51704449+recombyn@users.noreply.github.com"

      - name: Clone public repo
        id: pub_clone
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUBLIC_REPO_TOKEN is not configured in repository secrets." >&2
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" ./pub
          echo "tip=$(git -C ./pub rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy working tree
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="**/.venv/" \
            --exclude="**/__pycache__/" \
            --exclude="**/.pytest_cache/" \
            --exclude="**/dist/" \
            --exclude="**/.next/" \
            --exclude="**/build/" \
            --exclude="**/.turbo/" \
            --exclude="pub/" \
            --exclude="pub-test/" \
            ./ ./pub/

      - name: Strip commercial code and apply OSS stubs
        run: node scripts/sync-public-strip.mjs ./pub

      - name: Prepare public commit message
        id: pub_msg
        env:
          PUB_TIP: ${{ steps.pub_clone.outputs.tip }}
        run: |
          set -euo pipefail
          RAW="$(mktemp)"
          MSG_FILE="$(mktemp)"
          # Prefer concrete non-merge subjects since last public tip (not Merge PR #N).
          if [ -n "${PUB_TIP:-}" ] && git cat-file -e "${PUB_TIP}^{commit}" 2>/dev/null; then
            NEWEST="$(git log -1 --no-merges --format=%s "${GITHUB_SHA}" 2>/dev/null || true)"
            COUNT="$(git rev-list --no-merges --count "${PUB_TIP}..${GITHUB_SHA}" 2>/dev/null || echo 0)"
            if [ -n "$NEWEST" ] && [ "${COUNT:-0}" -gt 0 ]; then
              {
                echo "$NEWEST"
                echo
                if [ "$COUNT" -gt 1 ]; then
                  git log --no-merges --format='- %s' "${PUB_TIP}..${GITHUB_SHA}"
                else
                  git log -1 --no-merges --format=%b "${GITHUB_SHA}"
                fi
              } > "$RAW"
            fi
          fi
          if [ ! -s "$RAW" ]; then
            git log -1 --format=%B "${GITHUB_SHA}" > "$RAW"
          fi
          node scripts/sanitize-public-commit-msg.mjs < "$RAW" > "$MSG_FILE"
          TITLE="$(head -n 1 "$MSG_FILE")"
          echo "file=${MSG_FILE}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "---- public commit message ----"
          cat "$MSG_FILE"

      - name: Publish to public repo
        working-directory: ./pub
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUB_MSG_FILE: ${{ steps.pub_msg.outputs.file }}
          PUB_TITLE: ${{ steps.pub_msg.outputs.title }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git add -A
          if git diff --staged --quiet; then
            echo "No OSS changes to publish."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          PUB_BRANCH="release/${SHORT_SHA}"
          git commit -F "${PUB_MSG_FILE}"

          # Try direct push first (works when PAT has ruleset bypass).
          if git push origin "HEAD:main"; then
            echo "Pushed directly to main."
            exit 0
          fi

          echo "Direct push blocked by branch rules - opening PR (no CI wait)."
          git push origin "HEAD:${PUB_BRANCH}" --force

          PR_NUMBER="$(gh pr list --repo "${PUBLIC_REPO}" --head "${PUB_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "${PUBLIC_REPO}" --base main --head "${PUB_BRANCH}" \
              --title "${PUB_TITLE}" \
              --body-file "${PUB_MSG_FILE}"
            PR_NUMBER="$(gh pr list --repo "${PUBLIC_REPO}" --head "${PUB_BRANCH}" --json number --jq '.[0].number')"
          fi

          # Do not wait for zuoge Actions — message includes [skip ci]; merge with admin.
          gh pr merge "${PR_NUMBER}" --repo "${PUBLIC_REPO}" --squash --admin --delete-branch
