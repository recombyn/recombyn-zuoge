# Private → public one-way mirror (runs only in recombyn-dev).
# Strips src/commercial before publishing to github.com/recombyn/recombyn.
#
# Secret (recombyn-dev): PUBLIC_REPO_TOKEN — PAT with repo scope on recombyn/recombyn

name: Sync OSS mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: recombyn/recombyn
    steps:
      - name: Checkout private tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "recombyn"
          git config --global user.email "51704449+recombyn@users.noreply.github.com"

      - name: Clone public repo
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUBLIC_REPO_TOKEN is not configured in repository secrets." >&2
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" ./pub

      - name: Mirror working tree
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="**/.venv/" \
            --exclude="**/__pycache__/" \
            --exclude="**/.pytest_cache/" \
            --exclude="**/dist/" \
            --exclude="**/.next/" \
            --exclude="**/build/" \
            --exclude="**/.turbo/" \
            --exclude="pub/" \
            --exclude="pub-test/" \
            ./ ./pub/

      - name: Strip commercial code and apply OSS stubs
        run: node scripts/sync-public-strip.mjs ./pub

      - name: Publish to public repo
        working-directory: ./pub
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git add -A
          if git diff --staged --quiet; then
            echo "No OSS changes to publish."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          SYNC_BRANCH="chore/sync-${SHORT_SHA}"
          git commit -m "chore: sync from recombyn-dev @ ${SHORT_SHA}"

          # Try direct push first (works when PAT has ruleset bypass).
          if git push origin "HEAD:main"; then
            echo "Pushed directly to main."
            exit 0
          fi

          echo "Direct push blocked by branch rules — opening sync PR."
          git push origin "HEAD:${SYNC_BRANCH}" --force

          PR_NUMBER="$(gh pr list --repo "${PUBLIC_REPO}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "${PUBLIC_REPO}" --base main --head "${SYNC_BRANCH}" \
              --title "chore: sync from recombyn-dev @ ${SHORT_SHA}" \
              --body "Automated mirror from recombyn-dev. Do not edit manually."
            PR_NUMBER="$(gh pr list --repo "${PUBLIC_REPO}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number')"
          fi

          for _ in $(seq 1 36); do
            if gh pr checks "${PR_NUMBER}" --repo "${PUBLIC_REPO}" 2>/dev/null | grep -q .; then
              break
            fi
            sleep 10
          done
          gh pr checks "${PR_NUMBER}" --repo "${PUBLIC_REPO}" --watch --interval 15 || true
          gh pr merge "${PR_NUMBER}" --repo "${PUBLIC_REPO}" --merge --admin --delete-branch
