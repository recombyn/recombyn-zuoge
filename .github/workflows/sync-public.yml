# Private → public one-way mirror (runs only in recombyn-dev).
# Strips src/commercial before pushing to github.com/recombyn/recombyn.
#
# Setup (private repo secrets):
#   PUBLIC_REPO_TOKEN — PAT with repo scope on the public recombyn repo

name: Sync OSS mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: recombyn/recombyn
    steps:
      - name: Checkout private tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone public repo
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUBLIC_REPO_TOKEN is not configured in repository secrets." >&2
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" ./pub

      - name: Filter sync (drop commercial tree)
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude="src/commercial/" \
            --exclude="apps/web/src/private/" \
            --exclude="apps/api/private-eval/" \
            --exclude=".github/workflows/sync-public.yml" \
            --exclude="scripts/setup-private-remote.mjs" \
            ./ ./pub/
          echo "Synced tree size:" && du -sh ./pub | cut -f1

      - name: Push public repo
        working-directory: ./pub
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git add -A
          if git diff --staged --quiet; then
            echo "No OSS changes to publish."
            exit 0
          fi
          git commit -m "chore: sync from recombyn-dev @ ${GITHUB_SHA::7}"
          git push origin main
