name: Desktop build (Tauri)

# Unsigned Windows installer for smoke / self-host testing (ADR 0010).
# Signed releases need org secrets — see docs/desktop.md § Code signing.
# Not part of CI / gate (too slow).

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'local (sidecar) or cloud'
        type: choice
        options:
          - local
          - cloud
        default: local

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS workspaces
        run: npm ci

      - name: Install API desktop extras (sidecar)
        if: inputs.flavor == 'local'
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e "../../packages/scene-builder-py"
          pip install -e ".[desktop]"

      - name: Build desktop
        env:
          # Optional updater signing (Tauri). Leave unset for unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ inputs.flavor }}" -eq "cloud") {
            npm run build:desktop:cloud
          } else {
            npm run build:desktop
          }

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recombyn-desktop-${{ inputs.flavor }}-windows
          path: |
            apps/web/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
