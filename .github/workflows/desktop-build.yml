name: Desktop build (Tauri)

# Unsigned Windows installer for smoke testing (ADR 0010).
# Not part of CI / gate (too slow).

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: [self-hosted, Windows, ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS workspaces
        run: npm ci

      - name: Build desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:desktop

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recombyn-desktop-windows
          path: |
            apps/web/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
