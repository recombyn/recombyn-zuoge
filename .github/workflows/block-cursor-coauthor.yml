# Formerly auto-ran on every PR. Disabled — use workflow_dispatch only if needed.
# Main branch protection: require pull request (no required status checks).
name: Block Cursor co-author

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  no-cursor-coauthor:
    name: no-cursor-coauthor
    runs-on: [self-hosted, Windows, ci]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Co-authored-by Cursor
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          Write-Host 'Manual-only workflow. Prefer local husky/commit-msg to strip Cursor trailers.'
          Write-Host 'OK'
