name: CI

# Disabled for automatic PR/main runs — single self-hosted Windows runner is too
# slow / contended. Re-enable triggers only when a dedicated runner pool exists.
# Manual: Actions → CI → Run workflow

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, Windows, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint + contracts typecheck
        run: npm run check
      - name: Web typecheck
        run: npm run typecheck:web

  web-unit:
    runs-on: [self-hosted, Windows, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Web unit tests
        run: npm run test:web

  api-unit:
    runs-on: [self-hosted, Windows, ci]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # Prefer the self-hosted tool-cache / installed Python 3.12. Avoid
      # actions/setup-python (HKLM uninstall rewrite needs admin) and the
      # WindowsApps python stub (non-zero exit without a real interpreter).
      - name: Prefer runner Python 3.12
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $candidates = @(
            (Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.12.10\x64\python.exe'),
            (Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.12.9\x64\python.exe'),
            'C:\actions-runner\_work\_tool\Python\3.12.10\x64\python.exe',
            'C:\Users\DELL\AppData\Local\Programs\Python\Python312\python.exe'
          )
          $py = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $py) {
            $launcher = Get-Command py -ErrorAction SilentlyContinue
            if ($launcher) {
              $py = (& py -3.12 -c 'import sys; print(sys.executable)').Trim()
            }
          }
          if (-not $py -or -not (Test-Path $py)) {
            throw 'Python 3.12 not found on self-hosted runner (install or seed tool-cache)'
          }
          $bin = Split-Path -Parent $py
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "Using $py"
          & $py --version
      - name: Install API (+ test extras)
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e "../../packages/scene-builder-py"
          pip install -e "../../packages/protocol"
          pip install -e "../../packages/runtime"
          pip install -e "../../packages/intelligence-client"
          pip install -e "../../packages/agent-sdk"
          pip install -e "../../packages/skill-sdk"
          pip install -e "../../packages/plugin-sdk"
          pip install -e "../../packages/billing-sdk"
          pip install -e ".[dev]"
      - name: Ruff unused imports
        run: python -m ruff check app worker --select F401
      - name: Alembic single head
        run: python -m pytest tests/unit_tests/test_llm_facade_adr0006.py::test_alembic_single_head -q
      - name: Hydrate route coverage floor
        run: >
          python -m pytest tests/unit_tests/test_design_hydrate_jobs.py
          --cov=app.api.routes.design_hydrate_jobs
          --cov-report=term-missing
          --cov-fail-under=95
      - name: API unit tests
        env:
          TEST_DATABASE_URL: mysql://recombyn:recombyn@127.0.0.1:3306/recombyn_test
          DATABASE_URL: mysql://recombyn:recombyn@127.0.0.1:3306/recombyn_test
        run: python -m pytest tests/unit_tests -n auto
      - name: ILP BFF routing smoke (offline)
        run: python scripts/test_ilp_bff_smoke.py --mock

  build-web:
    runs-on: [self-hosted, Windows, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Production web build
        run: npm run build

  gate:
    runs-on: [self-hosted, Windows, ci]
    needs: [check, web-unit, api-unit, build-web]
    if: always()
    steps:
      - name: Require upstream jobs
        shell: bash
        run: |
          echo "check=${{ needs.check.result }}"
          echo "web-unit=${{ needs.web-unit.result }}"
          echo "api-unit=${{ needs.api-unit.result }}"
          echo "build-web=${{ needs.build-web.result }}"
          test "${{ needs.check.result }}" = "success" || exit 1
          test "${{ needs.web-unit.result }}" = "success" || exit 1
          test "${{ needs.api-unit.result }}" = "success" || exit 1
          test "${{ needs.build-web.result }}" = "success" || exit 1
