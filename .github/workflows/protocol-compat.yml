# Protocol compatibility (Intelligence in recombyn-dev monorepo)
# Runs against apps/intelligence using packages/protocol from this repo.
# Excluded from OSS mirror - private recombyn-dev only.

name: protocol-compat

on:
  push:
    branches: [main]
    paths:
      - "apps/intelligence/**"
      - "packages/protocol/**"
      - ".github/workflows/protocol-compat.yml"
  pull_request:
    paths:
      - "apps/intelligence/**"
      - "packages/protocol/**"
      - ".github/workflows/protocol-compat.yml"
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: "Optional git ref on recombyn/zuoge for packages/protocol"
        required: false
        default: "main"
  repository_dispatch:
    types: [protocol-changed]

defaults:
  run:
    working-directory: apps/intelligence
    shell: bash

jobs:
  contract:
    runs-on: [self-hosted, Windows, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve protocol ref
        id: ref
        run: |
          REF="${{ github.event.client_payload.protocol_ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.event.inputs.protocol_ref }}"
          fi
          if [ -n "$REF" ]; then
            echo "protocol_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "Using dispatched protocol ref: $REF"
          else
            echo "protocol_ref=" >> "$GITHUB_OUTPUT"
            echo "Using monorepo packages/protocol"
          fi

      - name: Checkout wire contract (when dispatched from public)
        if: steps.ref.outputs.protocol_ref != ''
        uses: actions/checkout@v4
        with:
          repository: recombyn/zuoge
          ref: ${{ steps.ref.outputs.protocol_ref }}
          path: _protocol_src
          sparse-checkout: |
            packages/protocol
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protocol + service
        run: |
          python -m pip install -U pip
          if [ -n "${{ steps.ref.outputs.protocol_ref }}" ]; then
            python -m pip install -e ../../_protocol_src/packages/protocol
          else
            python -m pip install -e ../../packages/protocol
          fi
          python -m pip install -e ".[dev]"
          python - <<'PY'
          from importlib.metadata import version
          print("recombyn-protocol", version("recombyn-protocol"))
          PY

      - name: Protocol contract tests
        run: python -m pytest tests/test_protocol_contract.py tests -q --tb=short

      - name: Vision unit tests
        run: python -m pytest tests/unit -q --tb=short

  vision-e2e:
    runs-on: [self-hosted, Windows, ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service + OCR
        run: |
          python -m pip install -U pip
          python -m pip install -e ../../packages/protocol
          python -m pip install -e ".[dev,ocr]"
        working-directory: apps/intelligence

      - name: Model readiness check (dev upscale fallback)
        working-directory: apps/intelligence
        env:
          ILP_UPSCALE_ALLOW_LANCZOS: "1"
        run: python scripts/setup_commercial_models.py --check

      - name: Start intelligence service
        working-directory: apps/intelligence
        env:
          INTELLIGENCE_SERVICE_API_KEY: dev-key
          ILP_UPSCALE_ALLOW_LANCZOS: "1"
        run: |
          uvicorn recombyn_intelligence_service.app:app --host 127.0.0.1 --port 8091 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8091/health >/dev/null; then
              echo "service ready"
              exit 0
            fi
            sleep 2
          done
          echo "service failed to start"
          exit 1

      - name: Vision HTTP smoke
        working-directory: apps/intelligence
        env:
          INTELLIGENCE_SERVICE_API_KEY: dev-key
          ILP_UPSCALE_ALLOW_LANCZOS: "1"
        run: |
          python scripts/test_ilp_e2e.py --api-key dev-key --mode health
          python scripts/test_ilp_e2e.py --api-key dev-key --mode analyze
