name: E2E Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/web/**'
      - 'e2e/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'e2e/**'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: [self-hosted, Windows, ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install monorepo
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm install

      # Self-hosted Windows: browsers preinstalled or downloaded without Linux apt deps.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run Playwright
        working-directory: e2e
        run: npm test
        env:
          CI: 'true'
          # Avoid clash with local `npm run dev:web` on :3000 (same self-hosted machine).
          E2E_PORT: '4173'
