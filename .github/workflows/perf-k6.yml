name: Perf k6 (Gate B)

# Manual — k6 needs Redis/API and blocks the sole self-hosted runner.

on:
  workflow_dispatch:

jobs:
  k6-gate:
    runs-on: [self-hosted, Windows, ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SUPER_ADMIN_TEST_CODE: ciperf01
      SUPER_ADMIN_EMAIL: admin@recombyn.com
      COLLAB_TOKEN_SECRET: ci-collab-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/collab/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Redis on localhost:6379
        run: |
          if command -v redis-cli >/dev/null 2>&1 && redis-cli ping 2>/dev/null | grep -qi pong; then
            echo "Redis already up"
            exit 0
          fi
          if command -v docker >/dev/null 2>&1; then
            docker rm -f ci-redis 2>/dev/null || true
            docker run -d --name ci-redis -p 6379:6379 redis:7-alpine
            for i in $(seq 1 30); do
              docker exec ci-redis redis-cli ping 2>/dev/null | grep -qi pong && exit 0
              sleep 1
            done
          fi
          echo "Redis required on self-hosted runner (local install or Docker)." >&2
          exit 1

      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e "../../packages/scene-builder-py"
          pip install -e "../../packages/protocol"
          pip install -e "../../packages/runtime"
          pip install -e "../../packages/intelligence-client"
          pip install -e "../../packages/agent-sdk"
          pip install -e "../../packages/skill-sdk"
          pip install -e "../../packages/plugin-sdk"
          pip install -e "../../packages/billing-sdk"
          pip install -e ".[dev]"

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://recombyn:recombyn@127.0.0.1:3306/recombyn
          REDIS_URL: redis://127.0.0.1:6379/0
          SUPER_ADMIN_TEST_CODE: ${{ env.SUPER_ADMIN_TEST_CODE }}
          COLLAB_TOKEN_SECRET: ${{ env.COLLAB_TOKEN_SECRET }}
          COLLAB_PUBLIC_WS_URL: ws://127.0.0.1:1234
          RATE_LIMIT_ENABLED: 'false'
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; tail -n 80 /tmp/api.log; exit 1

      - name: Start collab
        working-directory: apps/collab
        env:
          HOST: 127.0.0.1
          PORT: '1234'
          COLLAB_TOKEN_SECRET: ${{ env.COLLAB_TOKEN_SECRET }}
        run: |
          npm install --ignore-scripts
          nohup npm start > /tmp/collab.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:1234 >/dev/null; then
              echo "collab up"
              exit 0
            fi
            sleep 1
          done
          echo "collab failed"; tail -n 80 /tmp/collab.log; exit 1

      - name: Install k6
        run: |
          if command -v k6 >/dev/null 2>&1; then
            k6 version
            exit 0
          fi
          VER=v0.54.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/${VER}/k6-${VER}-windows-amd64.zip" -o /tmp/k6.zip
          mkdir -p "${RUNNER_TEMP}/k6"
          unzip -o /tmp/k6.zip -d "${RUNNER_TEMP}/k6"
          echo "${RUNNER_TEMP}/k6/k6-${VER}-windows-amd64" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/k6/k6-${VER}-windows-amd64/k6.exe" version

      - name: Mint PERF_TOKEN
        run: |
          TOKEN=$(SUPER_ADMIN_TEST_CODE="$SUPER_ADMIN_TEST_CODE" node scripts/ci-mint-token.mjs)
          echo "PERF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify PERF_TOKEN
        run: |
          code=$(curl -s -o /tmp/me.json -w "%{http_code}" -H "Authorization: Bearer $PERF_TOKEN" http://127.0.0.1:8000/api/v1/auth/me)
          echo "auth/me => $code"
          cat /tmp/me.json
          test "$code" = "200"

      - name: k6 smoke
        run: k6 run perf/k6/smoke.js
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: k6 api_crud
        run: k6 run perf/k6/api_crud.js
        env:
          BASE_URL: http://127.0.0.1:8000
          PERF_TOKEN: ${{ env.PERF_TOKEN }}

      - name: k6 collab_ws
        run: k6 run perf/k6/collab_ws.js
        env:
          COLLAB_WS_URL: ws://127.0.0.1:1234
          COLLAB_TOKEN_SECRET: ${{ env.COLLAB_TOKEN_SECRET }}

      - name: Dual Yjs merge
        working-directory: apps/collab
        env:
          COLLAB_WS_URL: ws://127.0.0.1:1234
          COLLAB_TOKEN_SECRET: ${{ env.COLLAB_TOKEN_SECRET }}
        run: node dual_client_merge.test.mjs
