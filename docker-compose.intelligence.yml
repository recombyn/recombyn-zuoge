# Optional override: attach an HTTP IntelligenceProvider (ADR 0017).
# Community default remains BasicLocal — do not enable this profile unless you
# operate a compatible provider (sibling checkout or your own image).
#
#   docker compose -f docker-compose.yml -f docker-compose.intelligence.yml \
#     --profile intelligence up -d --build
#
# Point RECOMBYN_INTELLIGENCE_CONTEXT at a checkout that ships a Dockerfile
# implementing POST /v1/{method} + GET /health.
# Default build context: ./src/commercial/intelligence when present.

services:
  intelligence:
    profiles: ["intelligence"]
    build:
      context: ${RECOMBYN_INTELLIGENCE_CONTEXT:-./src/commercial/intelligence}
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      INTELLIGENCE_SERVICE_API_KEY: ${RECOMBYN_INTELLIGENCE_API_KEY:-dev-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    profiles: ["intelligence"]
    environment:
      RECOMBYN_INTELLIGENCE_MODE: cloud
      RECOMBYN_INTELLIGENCE_URL: http://intelligence:8091
      RECOMBYN_INTELLIGENCE_API_KEY: ${RECOMBYN_INTELLIGENCE_API_KEY:-dev-key}
