# Prometheus — scrapes Recombyn API /metrics (Gate B)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: recombyn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: recombyn-api
          env: local
