# PodDisruptionBudgets — keep at least one pod during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: recombyn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
