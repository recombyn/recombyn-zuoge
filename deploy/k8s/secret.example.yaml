# Copy to secret.yaml and fill values. Do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: recombyn-secret
  namespace: recombyn
type: Opaque
stringData:
  DATABASE_URL: mysql://recombyn:CHANGE_ME@mysql:3306/recombyn
  COLLAB_TOKEN_SECRET: change-me-long-random
  CARD_KEY_SALT: change-me-long-random
  SUPER_ADMIN_BOOTSTRAP_PASSWORD: change-me-strong
  SUPER_ADMIN_EMAIL: admin@example.com
