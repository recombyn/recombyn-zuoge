apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab
  namespace: recombyn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collab
  template:
    metadata:
      labels:
        app: collab
    spec:
      containers:
        - name: collab
          image: ghcr.io/recombyn/recombyn/collab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1234
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1234"
            - name: OTEL_SERVICE_NAME
              value: recombyn-collab
          envFrom:
            - configMapRef:
                name: recombyn-config
            - secretRef:
                name: recombyn-secret
          readinessProbe:
            httpGet:
              path: /
              port: 1234
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: collab
  namespace: recombyn
spec:
  selector:
    app: collab
  ports:
    - port: 1234
      targetPort: 1234
