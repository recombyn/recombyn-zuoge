apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: recombyn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/recombyn/recombyn/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recombyn-config
            - secretRef:
                name: recombyn-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: recombyn-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: recombyn
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
