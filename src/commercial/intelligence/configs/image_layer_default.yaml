# ── Step 1: 空间测距 ──────────────────────────────────────────
depth:
  # HuggingFace: Depth-Anything-V2-Small / Base / Large
  model: depth-anything/Depth-Anything-V2-Small-hf
  # auto | transformers | proxy（proxy 仅用于无模型时跑通流程）
  backend: auto

# ── Step 2: 高精抠图（统一通用，非分场景产品）────────────────
segmentation:
  # rembg: birefnet-general | ben_custom (+ ILP_MATTING_ONNX / HR-matting ONNX)
  model: birefnet-general

# Production: one general path. Presets below are benchmark / fine-tune eval only.
matting:
  default_scene: general
  precision_onnx_env: ILP_MATTING_ONNX
  scenes:
    general:
      model: birefnet-general
      decontaminate: 0.65
    portrait:
      model: birefnet-portrait
      decontaminate: 0.72
    transparent:
      model: birefnet-general
      decontaminate: 0.55

# ── Step 3: 修边与深度切层 ────────────────────────────────────
mask:
  dilate_px: 16          # 主体膨胀，防溢色
  mid_dilate_px: 12      # 中景膨胀，供第二次重绘
  decontaminate_strength: 0.65
  feather_px: 2
  # 非主体像素深度分位：低于此值为远景，高于为中景（depth 越大越近）
  mid_far_quantile: 0.45

# ── Step 4: 级联 Inpainting ───────────────────────────────────
inpainting:
  # lama | opencv
  backend: lama

# ── Step 5: 资产封装 ──────────────────────────────────────────
export:
  write_psd: true
  write_png_layers: true

output:
  dir: outputs
