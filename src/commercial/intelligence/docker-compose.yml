# Standalone Intelligence HTTP provider for Cloud Runtime.
# Default: API + thread pool. Enable queue profile for Redis + Celery worker.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  intelligence:
    build: .
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      INTELLIGENCE_SERVICE_API_KEY: ${INTELLIGENCE_SERVICE_API_KEY:-dev-key}
      INTELLIGENCE_SERVICE_HOST: 0.0.0.0
      INTELLIGENCE_SERVICE_PORT: 8091
      INTELLIGENCE_DATA_DIR: /data
      INTELLIGENCE_EMBEDDING_BACKEND: ${INTELLIGENCE_EMBEDDING_BACKEND:-auto}
      INTELLIGENCE_EMBEDDING_BASE_URL: ${INTELLIGENCE_EMBEDDING_BASE_URL:-}
      INTELLIGENCE_EMBEDDING_API_KEY: ${INTELLIGENCE_EMBEDDING_API_KEY:-}
      INTELLIGENCE_EMBEDDING_MODEL: ${INTELLIGENCE_EMBEDDING_MODEL:-text-embedding-3-small}
      ILP_WORKSPACE: /data/vision
      ILP_MAX_JOB_WORKERS: ${ILP_MAX_JOB_WORKERS:-2}
      ILP_REDIS_URL: redis://redis:6379/0
      ILP_USE_CELERY: ${ILP_USE_CELERY:-false}
      FAL_KEY: ${FAL_KEY:-}
      ILP_FLUX_API_KEY: ${ILP_FLUX_API_KEY:-}
      ILP_FLUX_API_URL: ${ILP_FLUX_API_URL:-}
    volumes:
      - intelligence_data:/data
      - vision_workspace:/data/vision
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  intelligence-worker:
    build: .
    profiles: ["queue"]
    command:
      [
        "celery",
        "-A",
        "recombyn_intelligence_service.vision.infra.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-c",
        "1",
      ]
    environment:
      INTELLIGENCE_SERVICE_API_KEY: ${INTELLIGENCE_SERVICE_API_KEY:-dev-key}
      ILP_WORKSPACE: /data/vision
      ILP_CONFIG_YAML: /app/configs/image_layer_default.yaml
      ILP_REDIS_URL: redis://redis:6379/0
      ILP_USE_CELERY: "true"
      FAL_KEY: ${FAL_KEY:-}
      ILP_FLUX_API_KEY: ${ILP_FLUX_API_KEY:-}
      ILP_FLUX_API_URL: ${ILP_FLUX_API_URL:-}
    volumes:
      - vision_workspace:/data/vision
    depends_on:
      redis:
        condition: service_healthy

volumes:
  intelligence_data:
  vision_workspace:
